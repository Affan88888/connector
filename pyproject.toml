[project]
name = "connector"
version = "0.1.0"
description = "Tool for connecting devices for quickly sending links"
readme = "README.md"
authors = [
    { name = "Affan88888", email = "affankapidzic3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "keyring>=25.7.0",
    "numpy>=2.5.3",
    "platformdirs>=4.12.2",
    "pynacl>=1.6.2",
    "pyside6-essentials>=6.11.2",
    "qasync>=0.28.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
connector = "connector:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
